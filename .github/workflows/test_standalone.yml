name: Standalone Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }} # Value of the GPG private key to import
          gpg-passphrase: MAVEN_GPG_PASSPHRASE # env variable for GPG private key passphrase

      # The databend image's MINIO_ENABLED bootstrap downloads MinIO from
      # dl.min.io, which no longer serves it; run MinIO separately instead.
      - name: Start Databend With Minio
        working-directory: tests
        run: make up-standalone

      - name: Run Non-IT Tests
        working-directory: tests
        run: make test TEST_MVN_ARGS='-DexcludedGroups=FLAKY,IT,UNIT_ARROW'
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Run UNIT_ARROW Tests
        working-directory: tests
        run: make test TEST_MVN_ARGS='-Parrow-tests -DexcludedGroups=FLAKY'
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Run IT Tests
        working-directory: tests
        run: make test TEST_MVN_ARGS='-Dgroups=IT -DexcludedGroups=FLAKY'
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Run Arrow IT Tests
        working-directory: tests
        run: make test TEST_MVN_ARGS='-Dgroups=IT -DexcludedGroups=FLAKY'
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          DATABEND_JDBC_TEST_QUERY_RESULT_FORMAT: arrow

      - name: Show Service Logs
        if: failure()
        working-directory: tests
        run: make logs-standalone
