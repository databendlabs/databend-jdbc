# Single-node Databend backed by an external MinIO.
#
# The datafuselabs/databend image can bootstrap its own MinIO (MINIO_ENABLED),
# but it downloads the binary from dl.min.io, which no longer serves community
# releases. Run MinIO as a separate container instead.
#
# Both services use host networking so the S3 endpoint Databend embeds in
# presigned URLs (127.0.0.1:9000) is reachable from the test JVM as well.
name: databend-jdbc-standalone

services:
  minio:
    # Official MinIO registries no longer allow anonymous pulls. Pin the
    # Chainguard image by digest to keep integration tests reproducible.
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    network_mode: host
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    # Create the bucket directory before serving so Databend's startup
    # storage check finds it.
    entrypoint: ["/bin/sh", "-c", "mkdir -p /tmp/minio/databend && exec minio server /tmp/minio"]

  databend:
    image: docker.io/datafuselabs/databend:${DATABEND_VERSION:-nightly}
    network_mode: host
    environment:
      QUERY_DEFAULT_USER: databend
      QUERY_DEFAULT_PASSWORD: databend
      QUERY_STORAGE_TYPE: s3
      AWS_S3_ENDPOINT: http://127.0.0.1:9000
      AWS_S3_BUCKET: databend
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    # databend-query validates storage once at startup and exits on failure,
    # so wait for MinIO before running the image's bootstrap script.
    entrypoint:
      - /bin/bash
      - -c
      - until curl -fsS -o /dev/null http://127.0.0.1:9000/minio/health/live; do sleep 1; done; exec /bootstrap.sh
    depends_on:
      minio:
        condition: service_started
    healthcheck:
      test: "curl -f localhost:8080/v1/health || exit 1"
      interval: 2s
      retries: 30
      start_period: 5s
      timeout: 1s
